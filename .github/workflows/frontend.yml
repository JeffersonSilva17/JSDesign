name: frontend

on:
  push:
  pull_request:

jobs:
  next-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        indexing: ['false', 'true']
    env:
      SITE_URL: http://127.0.0.1:3000
      SEO_INDEXING_ENABLED: ${{ matrix.indexing }}

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:bff && npm run test:seo

      - name: Build
        run: npm run build
