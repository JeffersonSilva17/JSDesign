name: backend

on:
  push:
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jsdesign_test
          POSTGRES_USER: jsdesign
          POSTGRES_PASSWORD: jsdesign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsdesign -d jsdesign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run PostgreSQL migrations
        run: DB_DATABASE=jsdesign_test php artisan migrate:fresh --force --ansi

      - name: Run Laravel tests
        run: composer test

      - name: Run Laravel Pint
        run: vendor/bin/pint --test
