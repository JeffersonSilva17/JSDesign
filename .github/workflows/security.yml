name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Secrets in current files
        run: node scripts/scan-secrets.mjs
      - name: Secrets in history
        run: >-
          docker run --rm --network none -v "$PWD:/src:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /src --redact --no-banner --config /src/.gitleaks.toml
      - name: Semgrep security rules
        run: node scripts/scan-sast.mjs
      - name: Node dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=moderate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: PHP dependency audit
        working-directory: apps/api
        run: composer audit --locked --no-interaction
